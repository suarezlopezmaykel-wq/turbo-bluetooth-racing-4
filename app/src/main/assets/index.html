<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbo Racing 2D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { overflow: hidden; background: #111; font-family: sans-serif; }
        
        #menu { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: rgba(255,255,255,0.9); }
        button { background: #ff4b2b; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-bt { background: #0088ff; }

        #hud { position: absolute; top: 10px; left: 15px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #speedometer { position: absolute; top: 10px; right: 15px; color: #00ffff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }

        .controls { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn-group { display: flex; gap: 12px; }
        .btn-vertical { display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 62px; height: 62px; background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(255, 75, 43, 0.8); }
        .btn-rev { background: rgba(255, 165, 0, 0.4); font-size: 16px; font-weight: bold; }

        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="card">
            <h2 style="margin-bottom: 12px;">TURBO RACING 2D</h2>
            <label>Nombre Piloto:</label>
            <input type="text" id="playerName" value="Piloto 1" maxlength="12">
            <label>Seleccionar Circuitos:</label>
            <select id="trackSelect">
                <option value="0">1. Circuito Oval</option>
                <option value="1">2. Circuito Ocho (Curvas)</option>
            </select>
            <button id="startBtn">CARRERA INDIVIDUAL</button>
            <button id="btBtn" class="btn-bt">MULTIJUGADOR BLUETOOTH</button>
        </div>
    </div>

    <div id="hud">Piloto: <span id="hudName"></span></div>
    <div id="speedometer"><span id="speedVal">0</span> km/h</div>

    <div class="controls" id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-vertical">
            <div class="btn" id="btnGas">▲</div>
            <div class="btn btn-rev" id="btnReverse">R</div>
            <div class="btn" id="btnBrake">▼</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let speed = 0;
        const maxSpeed = 160, maxReverseSpeed = -40;
        let isGas = false, isBrake = false, isReverse = false, isLeft = false, isRight = false;
        let audioCtx, engineOsc, engineGain;

        // Auto del Jugador
        const player = { x: 300, y: 300, angle: 0, color: '#ff4b2b' };

        // Autos IA (Computadora)
        const aiCars = [
            { x: 280, y: 280, angle: 0, speed: 3.5, color: '#00ffff' },
            { x: 320, y: 280, angle: 0, speed: 3.2, color: '#ffd700' },
            { x: 300, y: 260, angle: 0, speed: 3.8, color: '#00ff7f' }
        ];

        document.getElementById('startBtn').onclick = () => startGame(false);
        document.getElementById('btBtn').onclick = () => {
            if (window.AndroidBluetooth) window.AndroidBluetooth.showToast("Buscando Bluetooth...");
            startGame(true);
        };

        function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function startGame(isBt) {
            document.getElementById('hudName').innerText = document.getElementById('playerName').value + (isBt ? " [BT]" : "");
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            initAudio();
            setupControls();
            loop();
        }

        function setupControls() {
            const bind = (id, fn) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); fn(true); };
                el.ontouchend = (e) => { e.preventDefault(); fn(false); };
            };
            bind('btnLeft', v => isLeft = v);
            bind('btnRight', v => isRight = v);
            bind('btnGas', v => isGas = v);
            bind('btnBrake', v => isBrake = v);
            bind('btnReverse', v => isReverse = v);
        }

        function drawCar(x, y, angle, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Carrocería
            ctx.fillStyle = color;
            ctx.fillRect(-12, -22, 24, 44);

            // Techo / Parabrisas
            ctx.fillStyle = '#111';
            ctx.fillRect(-8, -10, 16, 18);

            // Ruedas
            ctx.fillStyle = '#000';
            ctx.fillRect(-15, -18, 4, 10);
            ctx.fillRect(11, -18, 4, 10);
            ctx.fillRect(-15, 8, 4, 10);
            ctx.fillRect(11, 8, 4, 10);

            ctx.restore();
        }

        function loop() {
            requestAnimationFrame(loop);

            // Física del Jugador
            if (isGas && speed < maxSpeed) speed += 2.0;
            else if (isReverse && speed > maxReverseSpeed) speed -= 1.2;
            else if (isBrake) {
                if (speed > 0) speed -= 3.5;
                else if (speed < 0) speed += 3.5;
            } else {
                if (speed > 0) speed -= 0.8;
                if (speed < 0) speed += 0.8;
            }

            document.getElementById('speedVal').innerText = Math.round(Math.abs(speed));

            if (engineOsc && audioCtx) {
                const engineFreq = 40 + (Math.abs(speed) / maxSpeed) * 200;
                engineOsc.frequency.setTargetAtTime(engineFreq, audioCtx.currentTime, 0.1);
            }

            const turnSensitivity = 0.04;
            if (isLeft && Math.abs(speed) > 5) player.angle -= turnSensitivity * (speed > 0 ? 1 : -1);
            if (isRight && Math.abs(speed) > 5) player.angle += turnSensitivity * (speed > 0 ? 1 : -1);

            player.x += Math.sin(player.angle) * (speed / 20);
            player.y -= Math.cos(player.angle) * (speed / 20);

            // Renderizado (Cámara centrada en el jugador)
            ctx.save();
            ctx.fillStyle = '#2e8b57'; // Pasto del entorno
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Centrar vista en el auto
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // Dibujar Pista de Carreras con Curvas
            ctx.lineWidth = 120;
            ctx.strokeStyle = '#333';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.arc(300, 300, 250, 0, Math.PI * 2); // Pista ovalada
            ctx.stroke();

            // Línea de Meta
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(300 - 60, 50);
            ctx.lineTo(300 + 60, 50);
            ctx.stroke();

            // Dibujar Autos IA
            aiCars.forEach(ai => {
                ai.angle += 0.015;
                ai.x = 300 + Math.cos(ai.angle) * 250;
                ai.y = 300 + Math.sin(ai.angle) * 250;
                drawCar(ai.x, ai.y, ai.angle + Math.PI / 2, ai.color);
            });

            // Dibujar Jugador
            drawCar(player.x, player.y, player.angle, player.color);

            ctx.restore();
        }
    </script>
</body>
</html>
