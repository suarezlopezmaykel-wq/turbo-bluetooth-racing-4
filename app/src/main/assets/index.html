<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbo Bluetooth Racing 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: sans-serif; }
        #menu { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 90%; max-width: 420px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: rgba(255,255,255,0.9); }
        button { background: #ff4b2b; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-bt { background: #0088ff; }
        #hud { position: absolute; top: 12px; left: 15px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #speedometer { position: absolute; top: 12px; right: 15px; color: #00ffff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        .controls { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn-group { display: flex; gap: 12px; }
        .btn-vertical { display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 62px; height: 62px; background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(255, 75, 43, 0.8); }
        .btn-rev { background: rgba(255, 165, 0, 0.4); font-size: 16px; font-weight: bold; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="card">
            <h2 style="margin-bottom:12px;">TURBO RACING 3D</h2>
            <label>Nombre Piloto:</label>
            <input type="text" id="playerName" value="Piloto 1" maxlength="12">
            <label>Pista:</label>
            <select id="trackSelect">
                <option value="0">1. Neón Cyberpunk</option>
                <option value="1">2. Desierto Dorado</option>
                <option value="2">3. Cañón Helado</option>
                <option value="3">4. Volcán Magma</option>
            </select>
            <button id="startBtn">CARRERA INDIVIDUAL</button>
            <button id="btBtn" class="btn-bt">MULTIJUGADOR BLUETOOTH</button>
        </div>
    </div>

    <div id="hud">Piloto: <span id="hudName"></span></div>
    <div id="speedometer"><span id="speedVal">0</span> km/h</div>

    <div class="controls" id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-vertical">
            <div class="btn" id="btnGas">▲</div>
            <div class="btn btn-rev" id="btnReverse">R</div>
            <div class="btn" id="btnBrake">▼</div>
        </div>
    </div>

    <!-- CARGA LOCAL DESDE ASSETS DE LA APK -->
    <script src="three.min.js"></script>

    <script>
        let scene, camera, renderer, playerCar, cars = [];
        let speed = 0;
        const maxSpeed = 180, maxReverseSpeed = -50;
        let isGas = false, isBrake = false, isReverse = false, isLeft = false, isRight = false;
        let audioCtx, engineOsc, engineGain;

        const trackColors = [0x00ffff, 0xe6c280, 0xa6d5e8, 0xff4500];

        document.getElementById('startBtn').onclick = () => startGame(false);
        document.getElementById('btBtn').onclick = () => {
            if (window.AndroidBluetooth) window.AndroidBluetooth.showToast("Buscando partidas Bluetooth...");
            startGame(true);
        };

        function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function startGame(isBt) {
            document.getElementById('hudName').innerText = document.getElementById('playerName').value + (isBt ? " [BT]" : "");
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            initAudio();
            init3D(parseInt(document.getElementById('trackSelect').value));
        }

        function init3D(trackIdx) {
            if (typeof THREE === 'undefined') {
                alert("Error: El archivo three.min.js no se cargó correctamente desde assets.");
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(trackColors[trackIdx]);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: false, precision: 'mediump' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 0.9);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x777777));

            // Pista 3D
            const trackGeo = new THREE.PlaneGeometry(24, 4000);
            const trackMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            scene.add(track);

            // Autos (Jugador + 3 Computadoras)
            const startPositions = [{ x: -3, z: 0 }, { x: 3, z: 0 }, { x: -3, z: -10 }, { x: 3, z: -10 }];
            const carColors = [0xff4b2b, 0x00ffff, 0xffd700, 0x00ff7f];

            for (let i = 0; i < 4; i++) {
                const carGeo = new THREE.BoxGeometry(1.8, 0.8, 3.5);
                const carMat = new THREE.MeshBasicMaterial({ color: carColors[i] });
                const car = new THREE.Mesh(carGeo, carMat);
                car.position.set(startPositions[i].x, 0.4, startPositions[i].z);
                scene.add(car);
                cars.push(car);
            }

            playerCar = cars[0];
            setupControls();
            animate();
        }

        function setupControls() {
            const bind = (id, fn) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); fn(true); };
                el.ontouchend = (e) => { e.preventDefault(); fn(false); };
            };
            bind('btnLeft', v => isLeft = v);
            bind('btnRight', v => isRight = v);
            bind('btnGas', v => isGas = v);
            bind('btnBrake', v => isBrake = v);
            bind('btnReverse', v => isReverse = v);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGas) {
                if (speed < maxSpeed) speed += 1.2;
            } else if (isReverse) {
                if (speed > maxReverseSpeed) speed -= 1.0;
            } else if (isBrake) {
                if (speed > 0) speed -= 2.5;
                else if (speed < 0) speed += 2.5;
            } else {
                if (speed > 0) speed -= 0.5;
                if (speed < 0) speed += 0.5;
            }

            document.getElementById('speedVal').innerText = Math.round(Math.abs(speed));

            if (engineOsc && audioCtx) {
                const engineFreq = 40 + (Math.abs(speed) / maxSpeed) * 220;
                engineOsc.frequency.setTargetAtTime(engineFreq, audioCtx.currentTime, 0.1);
            }

            const dirMultiplier = speed < 0 ? -1 : 1;
            if (isLeft && playerCar.position.x > -10) playerCar.position.x -= 0.1 * dirMultiplier;
            if (isRight && playerCar.position.x < 10) playerCar.position.x += 0.1 * dirMultiplier;

            playerCar.position.z -= (speed / 3.6) * 0.05;

            // Movimiento de competidores IA (Computadora)
            for (let i = 1; i < 4; i++) {
                cars[i].position.z -= (130 / 3.6) * 0.05;
            }

            camera.position.x = playerCar.position.x;
            camera.position.z = playerCar.position.z + 7;
            camera.position.y = playerCar.position.y + 3;
            camera.lookAt(playerCar.position.x, playerCar.position.y + 0.5, playerCar.position.z - 5);

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
