<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbo Racing Professional 2D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        
        #menu { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: rgba(255,255,255,0.9); }
        button { background: #ff4b2b; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-bt { background: #0088ff; }

        #hud { position: absolute; top: 10px; left: 15px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #speedometer { position: absolute; top: 10px; right: 15px; color: #00ffff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #countdownOverlay { position: absolute; top: 30%; width: 100%; text-align: center; color: #ffeb3b; font-size: 80px; font-weight: bold; text-shadow: 4px 4px 10px #000; z-index: 20; display: none; }

        #resultsModal { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 150; color: white; }
        .results-card { background: #222; padding: 25px; border-radius: 15px; border: 2px solid #ff4b2b; width: 85%; max-width: 350px; text-align: center; }
        .results-list { list-style: none; margin: 15px 0; padding: 0; text-align: left; }
        .results-list li { padding: 8px; border-bottom: 1px solid #444; font-size: 18px; }

        .controls { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn-group { display: flex; gap: 12px; }
        .btn-vertical { display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 62px; height: 62px; background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(255, 75, 43, 0.8); }
        .btn-rev { background: rgba(255, 165, 0, 0.4); font-size: 16px; font-weight: bold; }

        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="card">
            <h2 style="margin-bottom: 12px;">TURBO RACING PRO 2D</h2>
            <label>Nombre Piloto:</label>
            <input type="text" id="playerName" value="Piloto 1" maxlength="12">
            <button id="startBtn">INICIAR CARRERA (20 KM)</button>
            <button id="btBtn" class="btn-bt">MULTIJUGADOR BLUETOOTH</button>
        </div>
    </div>

    <div id="hud">Piloto: <span id="hudName"></span></div>
    <div id="speedometer"><span id="speedVal">0</span> km/h</div>
    <div id="countdownOverlay">5</div>

    <div id="resultsModal">
        <div class="results-card">
            <h2>POSICIONES FINALES</h2>
            <ol id="positionsList" class="results-list"></ol>
            <button onclick="location.reload()">VOLVER A JUGAR</button>
        </div>
    </div>

    <div class="controls" id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-vertical">
            <div class="btn" id="btnGas">▲</div>
            <div class="btn btn-rev" id="btnReverse">R</div>
            <div class="btn" id="btnBrake">▼</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let speed = 0;
        const maxSpeed = 190, maxReverseSpeed = -50;
        let isGas = false, isBrake = false, isReverse = false, isLeft = false, isRight = false;
        let audioCtx, engineOsc, engineGain;
        let raceStarted = false, countdownValue = 5;
        let finishedCars = [];

        // Ancho de Pista de 4 vías
        const TRACK_WIDTH = 420; 
        const LANE_WIDTH = TRACK_WIDTH / 4;

        // Pista Gran Circuito Escala 20 km
        const trackPoints = [
            {x: 2000, y: 2000},
            {x: 12000, y: 2000},
            {x: 18000, y: 6000},
            {x: 18000, y: 14000},
            {x: 10000, y: 18000},
            {x: 4000, y: 14000},
            {x: 2000, y: 8000}
        ];

        // Zona de Parqueo
        const parkingZone = { x: 2000 - TRACK_WIDTH / 2 - 250, y: 1600 };

        // Autos Participantes
        const cars = [
            { id: 0, name: "Piloto 1", x: 2000 - 130, y: 2200, angle: 0, speed: 0, color: '#ff2222', isAI: false, finished: false, parkStep: 0 },
            { id: 1, name: "IA Alfa", x: 2000 - 45, y: 2250, angle: 0, speed: 0, color: '#00ffff', isAI: true, progress: 0.005, finished: false, parkStep: 0 },
            { id: 2, name: "IA Beta", x: 2000 + 45, y: 2300, angle: 0, speed: 0, color: '#ffcc00', isAI: true, progress: 0.003, finished: false, parkStep: 0 },
            { id: 3, name: "IA Gamma", x: 2000 + 130, y: 2350, angle: 0, speed: 0, color: '#00ff66', isAI: true, progress: 0.001, finished: false, parkStep: 0 }
        ];

        const player = cars[0];

        // Generar Vegetación Entorno
        const trees = [];
        for (let i = 0; i < 400; i++) {
            trees.push({
                x: Math.random() * 22000 - 2000,
                y: Math.random() * 22000 - 2000,
                size: 30 + Math.random() * 20
            });
        }

        document.getElementById('startBtn').onclick = () => startGame(false);
        document.getElementById('btBtn').onclick = () => startGame(true);

        function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {}
        }

        function startGame(isBt) {
            player.name = document.getElementById('playerName').value || "Piloto 1";
            document.getElementById('hudName').innerText = player.name + (isBt ? " [BT]" : "");
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            initAudio();
            setupControls();
            startCountdown();
            loop();
        }

        function startCountdown() {
            const cdBox = document.getElementById('countdownOverlay');
            cdBox.style.display = 'block';
            
            const timer = setInterval(() => {
                countdownValue--;
                if (countdownValue > 0) {
                    cdBox.innerText = countdownValue;
                } else if (countdownValue === 0) {
                    cdBox.innerText = "GO!";
                    raceStarted = true;
                } else {
                    cdBox.style.display = 'none';
                    clearInterval(timer);
                }
            }, 1000);
        }

        function setupControls() {
            const bind = (id, fn) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); fn(true); };
                el.ontouchend = (e) => { e.preventDefault(); fn(false); };
            };
            bind('btnLeft', v => isLeft = v);
            bind('btnRight', v => isRight = v);
            bind('btnGas', v => isGas = v);
            bind('btnBrake', v => isBrake = v);
            bind('btnReverse', v => isReverse = v);
        }

        function distanceToSegment(p, a, b) {
            const l2 = (b.x - a.x)**2 + (b.y - a.y)**2;
            if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
            let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
        }

        function getMinDistanceToTrack(car) {
            let minD = Infinity;
            for (let i = 0; i < trackPoints.length; i++) {
                const a = trackPoints[i];
                const b = trackPoints[(i + 1) % trackPoints.length];
                minD = Math.min(minD, distanceToSegment(car, a, b));
            }
            return minD;
        }

        function checkFenceCollision(car) {
            const maxAllowedDist = (TRACK_WIDTH / 2) - 15;
            const dist = getMinDistanceToTrack(car);

            if (dist > maxAllowedDist) {
                // Roce / Choque con valla
                if (!car.isAI) speed *= 0.3; // Reduce la velocidad al rozar la valla
                else car.speed *= 0.3;

                // Empuje de rebote hacia adentro
                const angleToCenter = Math.atan2(trackPoints[0].y - car.y, trackPoints[0].x - car.x);
                car.x += Math.cos(angleToCenter) * 8;
                car.y += Math.sin(angleToCenter) * 8;
            }
        }

        function drawCar(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.angle);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(-12, -20, 28, 48);

            // Carrocería
            ctx.fillStyle = c.color;
            ctx.fillRect(-14, -24, 28, 48);

            // Techo / Parabrisas
            ctx.fillStyle = '#111';
            ctx.fillRect(-10, -10, 20, 20);

            // Ruedas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(-17, -18, 5, 12);
            ctx.fillRect(12, -18, 5, 12);
            ctx.fillRect(-17, 8, 5, 12);
            ctx.fillRect(12, 8, 5, 12);

            ctx.restore();
        }

        function drawTrack() {
            // Vallas de Seguridad Exteriores
            ctx.lineWidth = TRACK_WIDTH + 30;
            ctx.strokeStyle = '#c1121f';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
            for (let i = 1; i < trackPoints.length; i++) ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
            ctx.closePath();
            ctx.stroke();

            // Pista Principal de Asfalto (4 Vías)
            ctx.lineWidth = TRACK_WIDTH;
            ctx.strokeStyle = '#2b2d42';
            ctx.stroke();

            // Divisiones de Carriles (4 Vías)
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.setLineDash([25, 25]);

            [-TRACK_WIDTH/4, 0, TRACK_WIDTH/4].forEach(offset => {
                ctx.beginPath();
                ctx.moveTo(trackPoints[0].x + offset, trackPoints[0].y);
                for (let i = 1; i < trackPoints.length; i++) ctx.lineTo(trackPoints[i].x + offset, trackPoints[i].y + offset);
                ctx.closePath();
                ctx.stroke();
            });
            ctx.setLineDash([]);

            // Marcador de Salida "GO"
            ctx.save();
            ctx.translate(trackPoints[0].x, trackPoints[0].y + 200);
            ctx.fillStyle = '#ffeb3b';
            ctx.font = 'bold 42px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("--- START / GO ---", 0, 0);
            ctx.restore();

            // Marcador de Meta "GOAL"
            ctx.save();
            ctx.translate(trackPoints[0].x, trackPoints[0].y - 100);
            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("=== FINISH / GOAL ===", 0, 0);
            ctx.restore();

            // Zona de Parqueo
            ctx.fillStyle = '#333';
            ctx.fillRect(parkingZone.x - 100, parkingZone.y - 150, 200, 300);
            ctx.strokeStyle = '#ffb703';
            ctx.lineWidth = 6;
            ctx.strokeRect(parkingZone.x - 100, parkingZone.y - 150, 200, 300);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText("PARKING", parkingZone.x - 40, parkingZone.y - 120);
        }

        function drawEnvironment() {
            trees.forEach(t => {
                // Dibujar solo si está dentro del campo visual
                if (Math.abs(t.x - player.x) < canvas.width && Math.abs(t.y - player.y) < canvas.height) {
                    ctx.save();
                    ctx.translate(t.x, t.y);
                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.arc(0, 0, t.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
        }

        function updateAutoParking(c, index) {
            const targetX = parkingZone.x;
            const targetY = parkingZone.y + (index * 60) - 80;

            const dx = targetX - c.x;
            const dy = targetY - c.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 10) {
                c.angle = Math.atan2(dx, -dy);
                c.x += Math.sin(c.angle) * 3;
                c.y -= Math.cos(c.angle) * 3;
            } else {
                c.speed = 0;
            }
        }

        function loop() {
            requestAnimationFrame(loop);

            if (raceStarted && !player.finished) {
                if (isGas && speed < maxSpeed) speed += 2.2;
                else if (isReverse && speed > maxReverseSpeed) speed -= 1.5;
                else if (isBrake) {
                    if (speed > 0) speed -= 4.0;
                    else if (speed < 0) speed += 4.0;
                } else {
                    if (speed > 0) speed -= 0.8;
                    if (speed < 0) speed += 0.8;
                }

                const turnSensitivity = 0.038;
                if (isLeft && Math.abs(speed) > 5) player.angle -= turnSensitivity * (speed > 0 ? 1 : -1);
                if (isRight && Math.abs(speed) > 5) player.angle += turnSensitivity * (speed > 0 ? 1 : -1);

                player.x += Math.sin(player.angle) * (speed / 15);
                player.y -= Math.cos(player.angle) * (speed / 15);

                checkFenceCollision(player);

                // Detección de paso de Meta para el jugador
                if (player.y <= trackPoints[0].y - 100 && player.x > trackPoints[0].x - TRACK_WIDTH/2 && player.x < trackPoints[0].x + TRACK_WIDTH/2) {
                    player.finished = true;
                    finishedCars.push(player);
                }
            }

            document.getElementById('speedVal').innerText = Math.round(Math.abs(speed));

            if (engineOsc && audioCtx) {
                const engineFreq = 40 + (Math.abs(speed) / maxSpeed) * 220;
                engineOsc.frequency.setTargetAtTime(engineFreq, audioCtx.currentTime, 0.1);
            }

            // MANTENER AL JUGADOR SIEMPRE EN EL CENTRO EXACTO DE LA PANTALLA
            ctx.save();
            ctx.fillStyle = '#52b788';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            drawTrack();
            drawEnvironment();

            // Mover y actualizar Autos IA
            cars.forEach((c, i) => {
                if (c.isAI && raceStarted && !c.finished) {
                    c.progress = (c.progress + 0.00025) % 1;
                    const numP = trackPoints.length;
                    const idx = Math.floor(c.progress * numP) % numP;
                    const nextIdx = (idx + 1) % numP;
                    const p1 = trackPoints[idx];
                    const p2 = trackPoints[nextIdx];
                    const localT = (c.progress * numP) % 1;

                    c.x = p1.x + (p2.x - p1.x) * localT;
                    c.y = p1.y + (p2.y - p1.y) * localT;
                    c.angle = Math.atan2(p2.x - p1.x, -(p2.y - p1.y));

                    if (c.y <= trackPoints[0].y - 100 && c.progress > 0.95) {
                        c.finished = true;
                        finishedCars.push(c);
                    }
                }

                // Si terminó la carrera, va al parqueo automáticamente
                if (c.finished) {
                    const parkIdx = finishedCars.indexOf(c);
                    updateAutoParking(c, parkIdx);
                }

                drawCar(c);
            });

            ctx.restore();

            // Finalizar Carrera cuando todos cruzan
            if (finishedCars.length === cars.length && document.getElementById('resultsModal').style.display !== 'flex') {
                showResults();
            }
        }

        function showResults() {
            const list = document.getElementById('positionsList');
            list.innerHTML = '';
            finishedCars.forEach((c, idx) => {
                const li = document.createElement('li');
                li.innerText = `${idx + 1}. ${c.name}`;
                list.appendChild(li);
            });
            document.getElementById('resultsModal').style.display = 'flex';
        }
    </script>
</body>
</html>
