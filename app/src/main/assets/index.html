<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbo Racing Pro - Circuitos</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        body { position: relative; }
        .overlay-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); z-index: 30; }
        .card { background: rgba(255,255,255,0.08); padding: 24px 20px; border-radius: 18px; width: min(90vw, 420px); text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
        .card h2 { margin-bottom: 12px; color: #fff; font-size: 1.7rem; }
        .card label { display: block; margin-bottom: 8px; color: #e7f7ff; text-align: left; font-size: 0.95rem; }
        input, button { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 10px; border: none; font-size: 15px; }
        input { background: rgba(255,255,255,0.92); color: #111; outline: none; }
        button { background: #ff4b2b; color: white; font-weight: bold; cursor: pointer; transition: transform 0.12s ease, filter 0.12s ease; }
        button:active { transform: scale(0.98); }
        .btn-bt { background: #0088ff; }
        .btn-track { background: #2ec4b6; margin-top: 10px; }
        .btn-exit { background: #6c757d; margin-top: 5px; }
        #hud { position: absolute; top: 12px; left: 16px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #speedometer { position: absolute; top: 10px; right: 18px; color: #00ffff; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #countdownOverlay { position: absolute; top: 30%; width: 100%; text-align: center; color: #ffeb3b; font-size: 80px; font-weight: bold; text-shadow: 4px 4px 10px #000; z-index: 20; display: none; }
        #resultsModal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 24; }
        .results-card { background: #222; padding: 25px 20px; border-radius: 15px; border: 2px solid #ff4b2b; width: min(85vw, 390px); text-align: center; color: white; }
        .results-list { list-style: none; margin: 15px 0; padding: 0; text-align: left; }
        .results-list li { padding: 8px 6px; border-bottom: 1px solid #444; font-size: 18px; }
        .controls { position: absolute; bottom: 18px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn-group { display: flex; gap: 12px; }
        .btn-vertical { display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 62px; height: 62px; background: rgba(0, 0, 0, 0.42); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(255, 75, 43, 0.8); }
        .btn-rev { background: rgba(255, 165, 0, 0.4); font-size: 16px; font-weight: bold; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="modeMenu" class="overlay-screen">
        <div class="card">
            <h2>TURBO RACING PRO</h2>
            <label>Nombre del Piloto</label>
            <input type="text" id="playerName" value="Piloto 1" maxlength="12">
            <button id="btnSingleMode">VS COMPUTADORA</button>
            <button id="btnBtMode" class="btn-bt">MULTIJUGADOR BLUETOOTH</button>
        </div>
    </div>
    <div id="bluetoothMenu" class="overlay-screen" style="display: none;">
        <div class="card">
            <h2>BLUETOOTH</h2>
            <p style="margin-bottom: 15px; color: #eef9ff;">Conecta los dispositivos antes de continuar.</p>
            <button id="btnConnectBluetooth" class="btn-bt">🔵 CONECTAR BLUETOOTH</button>
            <button id="btnContinueBluetooth" class="btn-track" style="background: #2a9d8f;">CONTINUAR</button>
        </div>
    </div>
    <div id="trackMenu" class="overlay-screen" style="display: none;">
        <div class="card">
            <h2>SELECCIONAR PISTA</h2>
            <button id="btnTrackForest" class="btn-track" style="background: #2a9d8f;">🌲 BOSQUE ENCANTADO</button>
            <button id="btnTrackDesert" class="btn-track" style="background: #e76f51;">🏜️ DESIERTO ROJO</button>
        </div>
    </div>
    <div id="hud">Piloto: <span id="hudName"></span></div>
    <div id="speedometer"><span id="speedVal">0</span> km/h</div>
    <div id="countdownOverlay">5</div>
    <div id="resultsModal">
        <div class="results-card">
            <h2>POSICIONES FINALES</h2>
            <ol id="positionsList" class="results-list"></ol>
            <button id="btnRestartRace">VOLVER A JUGAR</button>
            <button id="btnSelectTrack">CAMBIAR DE PISTA</button>
            <button id="btnExitGame" class="btn-exit">SALIR DEL JUEGO</button>
        </div>
    </div>
    <div class="controls" id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-vertical">
            <div class="btn" id="btnGas">▲</div>
            <div class="btn" id="btnBrake">▼</div>
            <div class="btn btn-rev" id="btnReverse">R</div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        let speed = 0;
        const maxSpeed = 190, maxReverseSpeed = -50;
        let isGas = false, isBrake = false, isReverse = false, isLeft = false, isRight = false;
        let audioCtx, engineOsc, engineGain;
        let raceStarted = false, countdownValue = 5;
        let finishedCars = [];
        let isMultiplayerBT = false;
        let selectedTrack = 'forest';
        const LANE_WIDTH = 80;
        const TRACK_WIDTH = LANE_WIDTH * 4;
        const ROAD_X = 2000;
        const START_Y = 5000;
        const GOAL_Y = -28000;
        const PARKING_Y = GOAL_Y - 1800;
        function getCurveOffset(y) {
            const bend = Math.sin(y * 0.00028) * 420;
            const secondary = Math.sin(y * 0.00012 + 2.4) * 130;
            return bend + secondary;
        }
        function getTrackCenterAtY(y) { return ROAD_X + getCurveOffset(y); }
        const parkingSlots = [
            { x: ROAD_X - 160, y: PARKING_Y - 90, occupied: false },
            { x: ROAD_X + 160, y: PARKING_Y - 90, occupied: false },
            { x: ROAD_X - 160, y: PARKING_Y + 90, occupied: false },
            { x: ROAD_X + 160, y: PARKING_Y + 90, occupied: false }
        ];
        const obstacles = [
            { y: 2000, lanes: [0, 1], rampLane: 0 },
            { y: -2000, lanes: [2, 3], rampLane: 3 },
            { y: -6000, lanes: [1, 2], rampLane: 1 },
            { y: -10000, lanes: [0, 1], rampLane: 1 },
            { y: -14000, lanes: [2, 3], rampLane: 2 },
            { y: -18000, lanes: [1, 2], rampLane: 2 },
            { y: -22000, lanes: [0, 1], rampLane: 0 },
            { y: -25000, lanes: [2, 3], rampLane: 3 }
        ];
        const cars = [
            { id: 0, name: "Piloto 1", x: ROAD_X - 1.5 * LANE_WIDTH, y: START_Y + 100, angle: 0, speed: 0, color: '#ff2222', isAI: false, finished: false, jumping: false, jumpZ: 0, aiState: 'FORWARD', targetSlot: null },
            { id: 1, name: "Jugador 2", x: ROAD_X - 0.5 * LANE_WIDTH, y: START_Y + 100, angle: 0, speed: 0, color: '#00ffff', isAI: true, finished: false, jumping: false, jumpZ: 0, aiState: 'FORWARD', targetSlot: null },
            { id: 2, name: "Jugador 3", x: ROAD_X + 0.5 * LANE_WIDTH, y: START_Y + 100, angle: 0, speed: 0, color: '#ffcc00', isAI: true, finished: false, jumping: false, jumpZ: 0, aiState: 'FORWARD', targetSlot: null },
            { id: 3, name: "Jugador 4", x: ROAD_X + 1.5 * LANE_WIDTH, y: START_Y + 100, angle: 0, speed: 0, color: '#00ff66', isAI: true, finished: false, jumping: false, jumpZ: 0, aiState: 'FORWARD', targetSlot: null }
        ];
        const player = cars[0];
        const scenery = [];
        for (let i = 0; i < 600; i++) {
            const side = Math.random() > 0.5 ? 1 : -1;
            const sy = START_Y + 1000 - Math.random() * (START_Y - GOAL_Y + 4000);
            if (sy < PARKING_Y + 500 && sy > PARKING_Y - 500) continue;
            const offset = getCurveOffset(sy);
            const sx = ROAD_X + offset + (side * (TRACK_WIDTH / 2 + 180 + Math.random() * 800));
            const randType = Math.random();
            let type = 'tree';
            if (randType < 0.4) type = 'tree';
            else if (randType < 0.7) type = 'house';
            else type = 'crowd';
            scenery.push({ x: sx, y: sy, size: 22 + Math.random() * 25, type });
        }
        document.getElementById('btnSingleMode').onclick = () => selectMode(false);
        document.getElementById('btnBtMode').onclick = () => selectMode(true);
        document.getElementById('btnConnectBluetooth').onclick = () => {
            if (window.AndroidBluetooth && window.AndroidBluetooth.connectBluetooth) {
                window.AndroidBluetooth.connectBluetooth();
            } else {
                alert('No se encuentra disponible la conexión Bluetooth.');
            }
        };
        document.getElementById('btnContinueBluetooth').onclick = () => {
            if (window.AndroidBluetooth && window.AndroidBluetooth.isBluetoothReady) {
                const ok = window.AndroidBluetooth.isBluetoothReady();
                if (ok !== false) {
                    document.getElementById('bluetoothMenu').style.display = 'none';
                    document.getElementById('trackMenu').style.display = 'flex';
                    return;
                }
            }
