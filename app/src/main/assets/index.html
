<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turbo Bluetooth Racing</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        #menu { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 90%; max-width: 480px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: rgba(255,255,255,0.9); }
        button { background: #ff4b2b; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-bt { background: #0088ff; margin-top: 4px; }

        #hud { position: absolute; top: 12px; left: 15px; color: white; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #speedometer { position: absolute; top: 12px; right: 15px; color: #00ffff; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }

        .controls-container { position: absolute; bottom: 15px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn-group { display: flex; gap: 12px; }
        .btn-vertical { display: flex; flex-direction: column; gap: 10px; }
        .btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 50%; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .btn:active { background: rgba(255, 75, 43, 0.8); }
        .btn-rev { background: rgba(255, 165, 0, 0.4); font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <div class="card">
            <h3 style="margin:0 0 10px 0;">TURBO RACING 3D</h3>
            <label>Nombre Piloto:</label>
            <input type="text" id="playerName" value="Piloto 1" maxlength="12">

            <label>Pista (1 a 10):</label>
            <select id="trackSelect">
                <option value="0">1. Neón Cyberpunk</option>
                <option value="1">2. Desierto Dorado</option>
                <option value="2">3. Cañón Helado</option>
                <option value="3">4. Bosque Esmeralda</option>
                <option value="4">5. Volcán de Magma</option>
                <option value="5">6. Costa Tropical</option>
                <option value="6">7. Pólis Nocturna</option>
                <option value="7">8. Valle Otoñal</option>
                <option value="8">9. Cañón Rocoso</option>
                <option value="9">10. Pista Espacial</option>
            </select>

            <button id="startBtn">CARRERA INDIVIDUAL</button>
            <button id="btBtn" class="btn-bt">MULTIJUGADOR BLUETOOTH</button>
        </div>
    </div>

    <div id="hud">Piloto: <span id="hudName"></span></div>
    <div id="speedometer"><span id="speedVal">0</span> km/h</div>

    <div class="controls-container" id="controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-vertical">
            <div class="btn" id="btnGas">▲</div>
            <div class="btn btn-rev" id="btnReverse">R</div>
            <div class="btn" id="btnBrake">▼</div>
        </div>
    </div>

    <!-- Motor 3D ligereado (Local / Offline) -->
    <script src="three.min.js"></script>

    <script>
        let scene, camera, renderer, playerCar, cars = [];
        let speed = 0;
        const maxSpeed = 180, maxReverseSpeed = -50;
        let isGas = false, isBrake = false, isReverse = false, isLeft = false, isRight = false;
        let audioCtx, engineOsc, engineGain, brakeOsc, brakeGain;
        let hasCollided = false;

        const trackColors = [
            0x00ffff, 0xe6c280, 0xa6d5e8, 0x2e8b57, 0xff4500,
            0x40e0d0, 0x191970, 0xd2691e, 0x8b4513, 0x4b0082
        ];

        document.getElementById('startBtn').addEventListener('click', () => startGame(false));
        document.getElementById('btBtn').addEventListener('click', () => {
            if (window.AndroidBluetooth) {
                window.AndroidBluetooth.showToast("Buscando partidas Bluetooth cercanas...");
            } else {
                alert("Modo Bluetooth disponible en dispositivo Android.");
            }
            startGame(true);
        });

        function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();

                brakeOsc = audioCtx.createOscillator();
                brakeGain = audioCtx.createGain();
                brakeOsc.type = 'triangle';
                brakeOsc.frequency.setValueAtTime(700, audioCtx.currentTime);
                brakeGain.gain.setValueAtTime(0, audioCtx.currentTime);
                brakeOsc.connect(brakeGain);
                brakeGain.connect(audioCtx.destination);
                brakeOsc.start();
            } catch(e) {}
        }

        function playCrashSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = buffer;
            const crashGain = audioCtx.createGain();
            crashGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            crashGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            whiteNoise.connect(crashGain);
            crashGain.connect(audioCtx.destination);
            whiteNoise.start();
        }

        function startGame(isBt) {
            const name = document.getElementById('playerName').value;
            const trackIdx = parseInt(document.getElementById('trackSelect').value);
            
            document.getElementById('hudName').innerText = name + (isBt ? " [BT]" : "");
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            initAudio();
            init3D(trackIdx);
        }

        function init3D(trackIdx) {
            if (typeof THREE === 'undefined') {
                alert("Error cargando motor 3D local.");
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(trackColors[trackIdx]);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({
                antialias: false,
                precision: 'mediump',
                powerPreference: 'low-power'
            });

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 0.9);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x777777));

            const trackGeo = new THREE.PlaneGeometry(24, 4000);
            const trackMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            scene.add(track);

            const startPositions = [{ x: -3, z: 0 }, { x: 3, z: 0 }, { x: -3, z: -8 }, { x: 3, z: -8 }];
            const carColors = [0xff4b2b, 0x00ffff, 0xffd700, 0x00ff7f];

            for (let i = 0; i < 4; i++) {
                const carGeo = new THREE.BoxGeometry(1.8, 0.8, 3.5);
                const carMat = new THREE.MeshBasicMaterial({ color: carColors[i] });
                const car = new THREE.Mesh(carGeo, carMat);
                car.position.set(startPositions[i].x, 0.4, startPositions[i].z);
                scene.add(car);
                cars.push(car);
            }

            playerCar = cars[0];
            camera.position.set(0, 3, 7);

            setupControls();
            animate();
        }

        function setupControls() {
            const bindTouch = (id, setVar) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); setVar(true); }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); setVar(false); }, {passive: false});
            };

            bindTouch('btnLeft', v => isLeft = v);
            bindTouch('btnRight', v => isRight = v);
            bindTouch('btnGas', v => isGas = v);
            bindTouch('btnBrake', v => isBrake = v);
            bindTouch('btnReverse', v => isReverse = v);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGas) {
                if (speed < maxSpeed) speed += 1.2;
            } else if (isReverse) {
                if (speed > maxReverseSpeed) speed -= 1.0;
            } else if (isBrake) {
                if (speed > 0) speed -= 2.5;
                else if (speed < 0) speed += 2.5;
            } else {
                if (speed > 0) speed -= 0.5;
                if (speed < 0) speed += 0.5;
            }

            document.getElementById('speedVal').innerText = Math.round(Math.abs(speed));

            if (engineOsc && audioCtx) {
                const engineFreq = 40 + (Math.abs(speed) / maxSpeed) * 240;
                engineOsc.frequency.setTargetAtTime(engineFreq, audioCtx.currentTime, 0.1);
            }

            const dirMultiplier = speed < 0 ? -1 : 1;
            const turnSensitivity = 0.09;

            if (isLeft && playerCar.position.x > -10) playerCar.position.x -= turnSensitivity * dirMultiplier;
            if (isRight && playerCar.position.x < 10) playerCar.position.x += turnSensitivity * dirMultiplier;

            if ((playerCar.position.x <= -9.8 || playerCar.position.x >= 9.8) && Math.abs(speed) > 20) {
                if (!hasCollided) {
                    playCrashSound();
                    speed = speed * -0.3;
                    hasCollided = true;
                    setTimeout(() => { hasCollided = false; }, 400);
                }
            }

            playerCar.position.z -= (speed / 3.6) * 0.05;

            for (let i = 1; i < 4; i++) {
                cars[i].position.z -= (130 / 3.6) * 0.05;
            }

            camera.position.x = playerCar.position.x;
            camera.position.z = playerCar.position.z + 7;
            camera.lookAt(playerCar.position.x, playerCar.position.y + 0.5, playerCar.position.z - 5);

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
